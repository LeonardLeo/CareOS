name: CI

# Required checks per `docs/12_Engineering_Handoff_Guide.md` Section 4: lint, type-check,
# unit tests, multi-tenant isolation tests, dependency/security scan, migration-safety check.
#
# The isolation job is separated out deliberately. `03_Technical_Architecture.md` Section 8
# requires cross-tenant read/write attempts to pass before merge, and
# `12_Engineering_Handoff_Guide.md` Section 3 names these as the tests most likely to be
# skipped under time pressure. A separate job means a failure names itself in the checks
# list rather than hiding inside a general "tests failed".

on:
  push:
    branches: [main]
  pull_request:

env:
  PYTHON_VERSION: "3.11"
  CAREOS_ENVIRONMENT: test
  # Pinned so an alert-rule check cannot start passing or failing because upstream
  # changed PromQL behaviour between runs.
  PROMETHEUS_VERSION: "3.1.0"
  ALERTMANAGER_VERSION: "0.28.0"

jobs:
  lint:
    name: Lint and type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The code cites docs/ by filename and section number in 221 places. Renumbering or
      # dropping a section invalidates every pointer to it and nothing else would notice.
      # Only the structure is checked here: scripts/check_docs_voice.py is a heuristic about
      # register and stays a manual tool, because a style score is not a merge gate.
      - name: Documentation sections must not move
        run: python3 scripts/check_docs_structure.py

      - name: Ignore rules must not exclude source paths
        run: |
          # A Python .gitignore's unanchored `lib/` once matched apps/admin-web/src/lib and
          # kept the web app's API client out of the repo entirely: it built locally, where
          # the files were on disk, and failed here, where they had never been committed.
          #
          # This checks the ignore *rules*, not the working tree. A clean checkout does not
          # contain the excluded files, so anything that scans for them on disk finds nothing
          # and passes vacuously. `git check-ignore` evaluates patterns against paths that do
          # not exist, which is what makes this catch the next one.
          status=0
          for path in \
            apps/admin-web/src/lib/x.ts \
            apps/admin-web/src/components/x.tsx \
            apps/admin-web/src/app/x/page.tsx \
            apps/admin-web/src/styles/x.css \
            services/api/careos/x.py \
            services/api/careos/modules/x/y.py \
            services/api/tests/test_x.py \
            services/api/alembic/versions/x.py \
            docs/x.md
          do
            if git check-ignore -q "$path"; then
              echo "::error::.gitignore excludes the source path $path"
              git check-ignore -v "$path"
              status=1
            fi
          done
          exit $status
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install
        working-directory: services/api
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Ruff lint
        working-directory: services/api
        run: ruff check careos tests
      - name: Ruff format check
        working-directory: services/api
        run: ruff format --check careos tests
      - name: Type check
        working-directory: services/api
        run: mypy careos

  test:
    name: Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      # A real Redis, because the shared rate-limit store is a Lua script whose whole point is
      # atomicity across processes and a clock every instance agrees on. A fake would
      # reimplement both in Python and prove neither. `test_ci_actually_runs_these` fails the
      # job if this service goes missing, so removing it cannot quietly skip the module.
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install
        working-directory: services/api
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run tests
        working-directory: services/api
        env:
          PGHOST: localhost
          PGPORT: "5432"
          PGPASSWORD: postgres
          # A database index of its own, so the store's tests cannot collide with anything
          # else a future job puts on this Redis.
          CAREOS_TEST_REDIS_URL: redis://localhost:6379/9
        run: pytest -q --junitxml=test-results.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: services/api/test-results.xml

  tenant-isolation:
    name: Multi-tenant isolation (required)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install
        working-directory: services/api
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Cross-tenant read/write attempts must fail
        working-directory: services/api
        env:
          PGHOST: localhost
          PGPORT: "5432"
          PGPASSWORD: postgres
        run: pytest tests/test_multitenant_isolation.py tests/test_rbac.py -v

  migration-safety:
    name: Migration safety
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: careos
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install
        working-directory: services/api
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Bootstrap roles
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d careos -v ON_ERROR_STOP=1 \
            -f services/api/scripts/bootstrap_db.sql
      - name: Upgrade, downgrade, and upgrade again
        working-directory: services/api
        env:
          CAREOS_MIGRATION_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/careos
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
      - name: Schema must match the models
        working-directory: services/api
        env:
          CAREOS_MIGRATION_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/careos
        run: |
          # An empty autogenerate diff proves the migrations and the ORM models agree.
          # Drift between them is how a table quietly ends up without RLS in production.
          alembic check
      - name: Reject destructive operations without sign-off
        run: |
          # Dropping a column or table in a compliance-sensitive system needs two-person
          # approval (12_Engineering_Handoff_Guide.md Section 4). CI blocks it unless the
          # migration carries an explicit, reviewable acknowledgement.
          if git diff --name-only origin/${{ github.base_ref || 'main' }}...HEAD \
               -- 'services/api/alembic/versions/*.py' | grep -q .; then
            CHANGED=$(git diff --name-only origin/${{ github.base_ref || 'main' }}...HEAD \
                      -- 'services/api/alembic/versions/*.py')
            for f in $CHANGED; do
              if grep -qE '^\s*op\.(drop_table|drop_column)\(' "$f" \
                 && ! grep -q 'DESTRUCTIVE-MIGRATION-APPROVED' "$f"; then
                echo "::error file=$f::Destructive migration without sign-off."
                echo "Add a 'DESTRUCTIVE-MIGRATION-APPROVED: <reviewer>' comment explaining"
                echo "the data-loss assessment, and get a second approval on the PR."
                exit 1
              fi
            done
          fi

  alert-rules:
    name: Alert rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install promtool and amtool
        run: |
          set -euo pipefail
          curl -sSL "https://github.com/prometheus/prometheus/releases/download/v${PROMETHEUS_VERSION}/prometheus-${PROMETHEUS_VERSION}.linux-amd64.tar.gz" \
            | tar xz --strip-components=1 -C /usr/local/bin \
                "prometheus-${PROMETHEUS_VERSION}.linux-amd64/promtool"
          curl -sSL "https://github.com/prometheus/alertmanager/releases/download/v${ALERTMANAGER_VERSION}/alertmanager-${ALERTMANAGER_VERSION}.linux-amd64.tar.gz" \
            | tar xz --strip-components=1 -C /usr/local/bin \
                "alertmanager-${ALERTMANAGER_VERSION}.linux-amd64/amtool"
      - name: Configuration is valid
        working-directory: ops/prometheus
        run: promtool check config prometheus.yml
      - name: Alert rules behave as intended
        # The unit tests, not just a syntax check. They pin the negative cases — a clock-in
        # answering 409 must not page, a flat counter must not keep alerting — because a rule
        # that fires on ordinary traffic is how people learn to ignore the pager.
        working-directory: ops/prometheus
        run: promtool test rules alerts_test.yml
      - name: Alertmanager routing is valid
        run: amtool check-config ops/alertmanager/alertmanager.yml
      - name: Severities reach the receivers they are meant to
        # `check-config` accepts a file whose routes send every page to the ticket receiver.
        # This asserts where each severity actually lands.
        run: |
          set -euo pipefail
          for pair in "page:page-placeholder" "ticket:ticket-placeholder"; do
            severity="${pair%%:*}"; expected="${pair##*:}"
            actual=$(amtool config routes test \
              --config.file=ops/alertmanager/alertmanager.yml "severity=$severity" | tail -1)
            if [ "$actual" != "$expected" ]; then
              echo "::error::severity=$severity routes to '$actual', expected '$expected'"
              exit 1
            fi
          done

  infrastructure:
    name: Terraform
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
      - name: Formatting
        run: terraform fmt -recursive -check -diff infra
      - name: Module inputs and outputs agree
        # Runs without provider schemas, so it works in an environment that cannot reach
        # registry.terraform.io. `terraform validate` below is stricter and needs the network;
        # this is what makes the same check available to a developer who has neither.
        run: python3 scripts/check_terraform_wiring.py
      - name: Validate each environment
        # `-backend=false` so validation needs no AWS credentials and no state bucket. It
        # still loads the provider schemas, which is what catches a misspelled argument or an
        # attribute that does not exist on a resource.
        run: |
          set -euo pipefail
          for env in infra/envs/*/; do
            echo "::group::$env"
            terraform -chdir="$env" init -backend=false -input=false -no-color
            terraform -chdir="$env" validate -no-color
            echo "::endgroup::"
          done
      - name: Production never points at a live aggregator by accident
        # `careos.config.validate_settings` refuses to boot production with
        # CAREOS_EVV_USE_SANDBOX true, and refuses staging nothing — so the inverse mistake,
        # staging transmitting to a real state aggregator, has no runtime guard at all. This
        # is that guard. A transmission from staging is a real filing about a real visit.
        run: |
          set -euo pipefail
          if ! grep -q 'evv_use_sandbox       = true' infra/envs/staging/main.tf; then
            echo "::error::staging must set evv_use_sandbox = true"
            exit 1
          fi
          if ! grep -q 'evv_use_sandbox       = false' infra/envs/production/main.tf; then
            echo "::error::production must set evv_use_sandbox = false"
            exit 1
          fi

  security-scan:
    name: Dependency and secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install scanners
        # setuptools is upgraded, not just pinned in the audit: PYSEC-2026-3447 is a flaw in
        # setuptools itself (MANIFEST.in exclusions bypassed by Unicode normalization, so a
        # file meant to stay private can be packed into an sdist), and the runner image ships
        # a version below the 83.0.0 fix. Since CI builds this package with `pip install -e .`,
        # upgrading the build tool is the remediation rather than a way to quiet the scanner.
        run: python -m pip install --upgrade pip "setuptools>=83.0.0" pip-audit
      - name: Audit dependencies
        working-directory: services/api
        # No `|| exit 1` — pip-audit's own non-zero exit already fails the step, and the
        # trailing clause only obscured which command failed.
        run: pip-audit --desc
      - name: Fail on committed secrets
        run: |
          # Credentials belong in the secrets manager (08_Security_Architecture.md §5).
          # The local-only placeholders are allowed by name; anything else is not.
          if git grep -nE '(SECRET|PASSWORD|TOKEN|API_KEY)\s*[:=]\s*["'"'"'][^"'"'"']{8,}' \
               -- ':!*.md' ':!docker-compose.yml' ':!*/bootstrap_db.sql' \
               ':!*/conftest.py' ':!*/test_*.py' \
             | grep -vE 'dev-only-insecure-secret-change-me|careos_app|careos_auth'; then
            echo "::error::Possible committed credential. Move it to the secrets manager."
            exit 1
          fi

  web:
    name: Admin web app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/admin-web/package-lock.json
      - name: Install
        working-directory: apps/admin-web
        run: npm ci
      - name: Type check
        working-directory: apps/admin-web
        run: npm run typecheck
      # The compiler already refuses a key defined in English and missing in Spanish. What it
      # cannot see is a sentence that never reached the dictionary at all — a heading typed
      # straight into the JSX renders an English title on a Spanish page, which is the
      # half-translated state that is worse than not translating. The script exists to catch
      # that and was not being run by anything.
      - name: Untranslated strings
        working-directory: apps/admin-web
        run: npm run i18n:check
      - name: Build
        working-directory: apps/admin-web
        run: npm run build

  site:
    name: Public site
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/site/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - name: Static export builds
        run: npm run build
      - name: The export is actually static
        # `output: "export"` fails loudly on a server-only feature, but a page that quietly
        # stops being exportable would only be discovered at deploy. This asserts the artefact.
        run: test -f out/index.html
      - name: Every page is linked, every link is a page
        # Cheap, and it catches the two silent drifts: a published page nothing links to, and a
        # navigation entry pointing at a route that was never built.
        run: node scripts/check-routes.mjs
      - name: Serve the export
        # `http.server` rather than a package from the registry: it maps a directory to its
        # index.html, which is all a static export is.
        run: |
          npx playwright install --with-deps chromium
          python3 -m http.server 3002 --directory out --bind 127.0.0.1 &
          for i in $(seq 1 20); do
            curl -fsS http://127.0.0.1:3002/ > /dev/null && break
            sleep 1
          done
      - name: Accessibility
        # `/legal/accessibility/` claims these checks run on every change and fail the build.
        # This is the step that makes that claim true.
        run: node scripts/a11y.mjs http://127.0.0.1:3002
      - name: Layout
        # Geometry, at four widths. Both defects it was written for shipped green through
        # everything above it: a list item 1096px tall, and a footer whose brand column
        # collapsed to 20px on a phone and painted the wordmark over the next column.
        run: node scripts/layout.mjs http://127.0.0.1:3002

  caregiver-app:
    name: Caregiver app (offline EVV)
    runs-on: ubuntu-latest
    # The offline clock-in path is the highest-stakes behaviour in Phase 1, and it is only
    # meaningfully testable against a real API and a real browser: the exactly-once guarantee
    # lives in the server's idempotency table, and the queueing lives in IndexedDB. So this job
    # stands up Postgres and the API rather than stubbing either.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: careos
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/caregiver-app/package-lock.json

      - name: Unit-test the sync engine
        working-directory: apps/caregiver-app
        run: |
          npm ci
          npm run typecheck
          npm test

      - name: Install and migrate the API
        working-directory: services/api
        env:
          PGPASSWORD: postgres
          # Reference data is migration-owned — the application roles hold SELECT only — so the
          # seed connects with the migration credential, same as the seed script documents.
          CAREOS_MIGRATION_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/careos
        run: |
          python -m pip install --upgrade pip "setuptools>=83.0.0"
          pip install -e ".[dev]"
          psql -h localhost -U postgres -d careos -v ON_ERROR_STOP=1 -f scripts/bootstrap_db.sql
          alembic upgrade head
          python -m careos.scripts.seed_reference_data
      - name: Start the API
        working-directory: services/api
        env:
          CAREOS_ENVIRONMENT: local
          # This job drives ~25 logins and signups from a single address in fifteen seconds,
          # which sits just under the production auth ceiling of 30/minute — close enough that
          # adding one test would start failing CI with a 429 that looks like a product bug.
          # Raised deliberately here: the limiter has its own tests
          # (`tests/test_rate_limits.py`), and this job's subject is the offline clock-in path.
          # The clock-in endpoints are exempt either way, so the flow under test is unaffected.
          CAREOS_RATE_LIMIT_AUTH_PER_IP_PER_MINUTE: "100000"
          CAREOS_RATE_LIMIT_AUTH_PER_MINUTE: "100000"
          CAREOS_RATE_LIMIT_STANDARD_PER_MINUTE: "100000"
        run: |
          nohup uvicorn careos.main:app --port 8000 > /tmp/api.log 2>&1 &
          for i in $(seq 1 30); do
            curl -fsS http://localhost:8000/health && break
            sleep 1
          done
          curl -fsS http://localhost:8000/health || { cat /tmp/api.log; exit 1; }

      - name: Build the app and run the offline end-to-end tests
        working-directory: apps/caregiver-app
        run: |
          npm run build
          npx playwright install --with-deps chromium
          npx playwright test
      # The API's own traceback is the only place a 500 from the seed explains itself, and
      # without this the job reports "POST /v1/agencies -> 500" and nothing else.
      - name: API log
        if: always()
        run: tail -200 /tmp/api.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: caregiver-app-diagnostics
          path: |
            apps/caregiver-app/screenshots/
            apps/caregiver-app/test-results/
            /tmp/api.log
