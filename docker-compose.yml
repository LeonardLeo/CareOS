# Local development stack (`03_Technical_Architecture.md` Section 7).
#
# Postgres and Redis only, plus the API. Nothing here talks to a real EVV aggregator or
# clearinghouse — the loopback EVV adapter handles that locally, and the registry refuses
# to use it when CAREOS_ENVIRONMENT=production.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: careos
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Creates the careos_app / careos_auth roles on first boot. Postgres runs everything
      # in this directory once, when the data volume is empty.
      - ./services/api/scripts/bootstrap_db.sql:/docker-entrypoint-initdb.d/10-bootstrap.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d careos"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./services/api
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      CAREOS_ENVIRONMENT: local
      CAREOS_DATABASE_URL: postgresql+asyncpg://careos_app:careos_app@postgres:5432/careos
      CAREOS_PRIVILEGED_DATABASE_URL: postgresql+asyncpg://careos_auth:careos_auth@postgres:5432/careos
      CAREOS_MIGRATION_DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/careos
      CAREOS_REDIS_URL: redis://redis:6379/0
      # Compose runs one instance, so memory would be correct here — set to redis anyway so the
      # path production takes is the path that gets exercised in development. Production may not
      # set memory at all; `validate_settings` refuses to boot on it.
      CAREOS_RATE_LIMIT_BACKEND: redis
      # Local-only values. Deployed environments read these from the secrets manager
      # (`08_Security_Architecture.md` Section 5) and never from a compose file.
      CAREOS_JWT_SECRET: dev-only-insecure-secret-change-me
      CAREOS_EVV_USE_SANDBOX: "true"
    ports:
      - "8000:8000"
    command: >
      sh -c "alembic upgrade head &&
             python -m careos.scripts.seed_reference_data &&
             uvicorn careos.main:app --host 0.0.0.0 --port 8000 --reload"
    volumes:
      - ./services/api/careos:/app/careos:ro

  # --- Observability ---------------------------------------------------------------------
  # Present in the local stack rather than only in a deployment guide, because the step most
  # likely to be wrong in an alerting setup is the last one, and it is the only step that
  # cannot be verified by reading configuration.

  prometheus:
    image: prom/prometheus:v3.1.0
    depends_on:
      - api
    volumes:
      - ./ops/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./ops/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      # Short retention: this stack exists to prove the wiring, not to keep history.
      - --storage.tsdb.retention.time=6h
    ports:
      - "9090:9090"

  alertmanager:
    image: prom/alertmanager:v0.28.0
    volumes:
      - ./ops/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
    ports:
      - "9093:9093"

  alert-sink:
    # Where `page` and `ticket` land locally. A real deployment replaces this with PagerDuty
    # or Slack; see ops/alertmanager/alertmanager.yml, and BUILD_STATUS for what that means
    # for the honest description of this system's alerting.
    image: python:3.11-alpine
    volumes:
      - ./ops/alert-sink/sink.py:/sink.py:ro
    command: ["python", "-u", "/sink.py"]
    ports:
      - "9099:9099"

volumes:
  postgres_data:
